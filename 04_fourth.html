<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom learning p4</title>
</head>
<body style="background-color: black;color: #f0c4c4;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
    const li = document.createElement('li');
    li.innerHTML = `${langName}`
    document.querySelector('.language').appendChild(li)
    }
    addLanguage("java")
    addLanguage("typeScript")

    // More optimize way of doing that...........

    function addOptiLanguage (langName){
        const li = document.createElement('li');
        li.appendChild(
            document.createTextNode(langName)
        )
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('python')


    // Edit.........

    const second = document.querySelector('li:nth-child(2)')
    // console.log(second);
    // second.innerHTML = 'mmii'

    const newli = document.createElement('li')
    newli.textContent = 'mojo'
    second.replaceWith(newli)

    // Edit............
    const first = document.querySelector('li:first-child')
    first.outerHTML = '<li>java kkk</li>'

    // Remove
    const last = document.querySelector('li:last-child')
    last.remove()
</script>
</html>
