<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom learnig</title>
</head>
<body style="background-color: black; color: mediumaquamarine;">
    <div class="parent" >
        <div class="day">monday</div>
        <div class="day">tuesday</div>
        <div class="day">wednesday</div>
        <div class="day">thursday</div>
    </div>
</body>
<script>
   const parent = document.querySelector('.parent')  // this is how we use class in queryselector
   console.log(parent);
   console.log(parent.children);
   console.log(parent.children[0]);
   console.log(parent.children[0].innerHTML);

   for (let i = 0; i < parent.children.length; i++) {
    console.log(parent.children[i].innerHTML);
   }
   parent.children[0].style.color = "red"

   console.log(parent.firstElementChild);            // .first or .lastElementChild, is use to move parent to child
   console.log(parent.lastElementChild);   

   const dayOne = document.querySelector('.day')       // this is how we go clild to parent
   console.log(dayOne);
   console.log(dayOne.parentElement);
   console.log(dayOne.nextElementSibling);           // we can access the siblings

   const parentOne = dayOne.parentElement
   console.log(parentOne);
   
   console.log('Nodes: ', parent.childNodes);        //parent.childNodes, it shows the complex tree structure behind yhe scene
   
</script>
</html>
