<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
        /* Add shadows to create the "card" effect */
        width: 500px;
        height: 600px;
        box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
        transition: 0.3s;
      }
    .container {
        padding: 2px 16px;
      }
    </style>
</head>
<body>
    // 0	UNSENT	Client has been created. open() not called yet.
// 1	OPENED	open() has been called.
// 2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
// 3	LOADING	Downloading; responseText holds partial data.
// 4	DONE	The operation is complete.
</body>
<script>
    const requestUrl = 'https://api.github.com/users/hiteshchoudhary'    // api link, needs to be in string
    const xhr = new XMLHttpRequest();                                 // we need XMLHttpRequest();  trun it into object first
    xhr.open('GET', requestUrl)
    
    xhr.onreadystatechange = function(){                              // is use to continiously monitor
        console.log(xhr.readyState);
        if (xhr.readyState === 4) {                                   // JSON.parse convert data into JSON
            const data = JSON.parse(this.responseText)                // we got the response as response text
                                                                      // most of the time we got data response from url in string formate
            console.log(typeof data);
            console.log(data.followers);
        }
    }
    xhr.send();

   



</script>
</html>
